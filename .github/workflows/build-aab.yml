
name: SolveX - Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto SolveX
        run: |
          unzip -o SolveX-Android-Projeto.zip -d .

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar AAB e APK
        run: |
          gradle :app:bundleRelease :app:assembleDebug

      - name: Disponibilizar AAB
        uses: actions/upload-artifact@v4
        with:
          name: SolveX-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SolveX-APK-Teste
          path: app/build/outputs/apk/debug/*.apk
